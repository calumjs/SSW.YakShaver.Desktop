name: Build on All Branches

on:
  pull_request:
    types: [opened, synchronize]  # Trigger when PR is opened or when new commits are pushed to PR
  push:
    branches:
      - '**'  # Trigger on push to any branch

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  APP_NAME: SSW.YakShaver
  NODE_VERSION: 20
  # Build configuration: Set BUILD_WINDOWS, BUILD_MACOS, BUILD_LINUX as repository variables
  # To enable a platform, set the corresponding variable to 'true' in repository settings
  # Repository variables: Settings > Secrets and variables > Actions > Variables tab
  # Note: Use repository variables (not secrets) for job-level if conditions

jobs:
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      has-open-pr: ${{ steps.check.outputs.has-open-pr || 'false' }}
    steps:
      - name: Check for open PR
        id: check
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${ref}`,
              state: 'open'
            });
            core.setOutput('has-open-pr', prs.length > 0 ? 'true' : 'false');
      - name: Skip check for pull_request events
        if: github.event_name == 'pull_request'
        run: echo "Skipping PR check for pull_request events"

  build-windows:
    runs-on: windows-latest
    needs: [check-pr]
    if: |
      vars.BUILD_WINDOWS == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && needs.check-pr.outputs.has-open-pr == 'false')
      )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO: Remove this step once this PBI is done: https://github.com/SSWConsulting/SSW.YakShaver/issues/3095
      - name: Create .env from secrets
        shell: pwsh
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          "YOUTUBE_CLIENT_ID=$env:YOUTUBE_CLIENT_ID" | Out-File -FilePath ".env" -Encoding utf8 -NoNewline
          Add-Content -Path ".env" -Value "`nYOUTUBE_CLIENT_SECRET=$env:YOUTUBE_CLIENT_SECRET"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install UI dependencies
        run: npm ci --prefer-offline
        working-directory: src/ui

      - name: Build Windows app
        run: npm run make
        env:
          NODE_ENV: production
          CI: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: |
            out/make/**
            SSW.YakShaver-windows-*

  build-macos:
    runs-on: macos-latest
    needs: [check-pr]
    if: |
      vars.BUILD_MACOS == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && needs.check-pr.outputs.has-open-pr == 'false')
      )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO: Remove this step once this PBI is done: https://github.com/SSWConsulting/SSW.YakShaver/issues/3095
      - name: Create .env from secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          printf "YOUTUBE_CLIENT_ID=%s\nYOUTUBE_CLIENT_SECRET=%s\n" "$YOUTUBE_CLIENT_ID" "$YOUTUBE_CLIENT_SECRET" > .env

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install UI dependencies
        run: npm ci --prefer-offline
        working-directory: src/ui

      - name: Build macOS app
        run: npm run make
        env:
          NODE_ENV: production
          CI: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: |
            out/make/**
            SSW.YakShaver-darwin-*

  build-linux:
    runs-on: ubuntu-latest
    needs: [check-pr]
    if: |
      vars.BUILD_LINUX == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && needs.check-pr.outputs.has-open-pr == 'false')
      )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO: Remove this step once this PBI is done: https://github.com/SSWConsulting/SSW.YakShaver/issues/3095
      - name: Create .env from secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          printf "YOUTUBE_CLIENT_ID=%s\nYOUTUBE_CLIENT_SECRET=%s\n" "$YOUTUBE_CLIENT_ID" "$YOUTUBE_CLIENT_SECRET" > .env

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install UI dependencies
        run: npm ci --prefer-offline
        working-directory: src/ui

      - name: Build Linux app
        run: npm run make
        env:
          NODE_ENV: production
          CI: true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: |
            out/make/**
            SSW.YakShaver-linux-*

  comment-pr:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment PR with download links
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const artifactsUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const platforms = [];
            
            if ('${{ needs.build-windows.result }}' === 'success') {
              platforms.push('🪟 **Windows**');
            }
            if ('${{ needs.build-macos.result }}' === 'success') {
              platforms.push('🍎 **macOS**');
            }
            if ('${{ needs.build-linux.result }}' === 'success') {
              platforms.push('🐧 **Linux**');
            }
            
            const body = `## 📦 Build Artifacts Available
            
            Build completed for the following platforms:
            ${platforms.join('\n')}
            
            📥 **Download artifacts:** [View workflow run](${artifactsUrl})
            
            Navigate to the "Artifacts" section at the bottom of the workflow run page to download the build files.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
