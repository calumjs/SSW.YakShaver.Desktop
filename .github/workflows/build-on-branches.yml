name: Build on All Branches

on:
  issue_comment:
    types: [created]  # Trigger when a comment is created on a PR
  # Note: Automatically building on every PR update is disabled to save CI resources.
  # Comment "/build", "/test-build", or "/rebuild" on a PR to trigger a build manually.

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  APP_NAME: SSW.YakShaver
  NODE_VERSION: 20
  # Build configuration: Set BUILD_WINDOWS, BUILD_MACOS, BUILD_LINUX as repository variables
  # To enable a platform, set the corresponding variable to 'true' in repository settings
  # Repository variables: Settings > Secrets and variables > Actions > Variables tab
  # Note: Use repository variables (not secrets) for job-level if conditions

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      is-draft: ${{ steps.check.outputs.is-draft }}
    steps:
      - name: Check build trigger and PR status
        id: check
        run: |
          # Comment trigger - check if it's a build command
          comment="${{ github.event.comment.body }}"
          if [[ "$comment" =~ ^/(build|test-build|rebuild) ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            # Get PR details to check draft status
            PR_NUMBER="${{ github.event.issue.number }}"
            PR_RESPONSE=$(gh pr view $PR_NUMBER --json isDraft,number,headRefName || echo '{"isDraft":false}')
            IS_DRAFT=$(echo "$PR_RESPONSE" | jq -r '.isDraft // false')
            echo "is-draft=$IS_DRAFT" >> $GITHUB_OUTPUT
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "is-draft=false" >> $GITHUB_OUTPUT
          fi
      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (apt-get update && apt-get install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update && apt-get install gh -y

  build-windows:
    needs: check-trigger
    runs-on: windows-latest
    if: |
      vars.BUILD_WINDOWS == 'true' && 
      needs.check-trigger.outputs.should-build == 'true' &&
      needs.check-trigger.outputs.is-draft == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO: Remove this step once this PBI is done: https://github.com/SSWConsulting/SSW.YakShaver/issues/3095
      - name: Create .env from secrets
        shell: pwsh
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          "YOUTUBE_CLIENT_ID=$env:YOUTUBE_CLIENT_ID" | Out-File -FilePath ".env" -Encoding utf8 -NoNewline
          Add-Content -Path ".env" -Value "`nYOUTUBE_CLIENT_SECRET=$env:YOUTUBE_CLIENT_SECRET"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install UI dependencies
        run: npm ci --prefer-offline
        working-directory: src/ui

      - name: Build Windows app
        run: npm run make
        env:
          NODE_ENV: production
          CI: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-pr${{ github.event.issue.number }}-${{ github.sha }}
          path: |
            out/make/**
            SSW.YakShaver-windows-*

  build-macos:
    needs: check-trigger
    runs-on: macos-latest
    if: |
      vars.BUILD_MACOS == 'true' && 
      needs.check-trigger.outputs.should-build == 'true' &&
      needs.check-trigger.outputs.is-draft == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO: Remove this step once this PBI is done: https://github.com/SSWConsulting/SSW.YakShaver/issues/3095
      - name: Create .env from secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          printf "YOUTUBE_CLIENT_ID=%s\nYOUTUBE_CLIENT_SECRET=%s\n" "$YOUTUBE_CLIENT_ID" "$YOUTUBE_CLIENT_SECRET" > .env

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install UI dependencies
        run: npm ci --prefer-offline
        working-directory: src/ui

      - name: Build macOS app
        run: npm run make
        env:
          NODE_ENV: production
          CI: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-pr${{ github.event.issue.number }}-${{ github.sha }}
          path: |
            out/make/**
            SSW.YakShaver-darwin-*

  build-linux:
    needs: check-trigger
    runs-on: ubuntu-latest
    if: |
      vars.BUILD_LINUX == 'true' && 
      needs.check-trigger.outputs.should-build == 'true' &&
      needs.check-trigger.outputs.is-draft == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO: Remove this step once this PBI is done: https://github.com/SSWConsulting/SSW.YakShaver/issues/3095
      - name: Create .env from secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          printf "YOUTUBE_CLIENT_ID=%s\nYOUTUBE_CLIENT_SECRET=%s\n" "$YOUTUBE_CLIENT_ID" "$YOUTUBE_CLIENT_SECRET" > .env

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install UI dependencies
        run: npm ci --prefer-offline
        working-directory: src/ui

      - name: Build Linux app
        run: npm run make
        env:
          NODE_ENV: production
          CI: true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-pr${{ github.event.issue.number }}-${{ github.sha }}
          path: |
            out/make/**
            SSW.YakShaver-linux-*

  comment-pr:
    needs: [check-trigger, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment PR with download links
        uses: actions/github-script@v7
        with:
          script: |
            const artifactsUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const platforms = [];
            
            if ('${{ needs.build-windows.result }}' === 'success') {
              platforms.push('🪟 **Windows**');
            }
            if ('${{ needs.build-macos.result }}' === 'success') {
              platforms.push('🍎 **macOS**');
            }
            if ('${{ needs.build-linux.result }}' === 'success') {
              platforms.push('🐧 **Linux**');
            }
            
            const body = `## 📦 Build Artifacts Available
            
            Build completed for the following platforms:
            ${platforms.join('\n')}
            
            📥 **Download artifacts:** [View workflow run](${artifactsUrl})
            
            Navigate to the "Artifacts" section at the bottom of the workflow run page to download the build files.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.payload.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
